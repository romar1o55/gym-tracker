<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090909" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Gym Tracker" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css">
    <script src="./scripts.js" defer></script>
    <title>Gym Tracker</title>
  </head>
  <body>
    <header>
      <div>
        <h1>GYM TRACKER</h1>
        <div class="sub">Твой прогресс. Твои правила.</div>
      </div>
      <div class="pill">● МОЙ ЗАЛ</div>
    </header>
    <main id="app">
      <section id="workout">
        <div class="row">
          <div>
            <div class="muted small" id="today"></div>
            <h2>Тренировка</h2>
          </div>
          <button class="secondary" id="finish">Завершить</button>
        </div>
        <div class="card">
          <div class="row">
            <div>
              <h3>Текущая тренировка</h3>
              <div class="sub">Добавляй упражнения и записывай подходы</div>
            </div>
          </div>
          <div id="exercises">
            <div class="empty">
              Пока нет упражнений.<br />Добавь первое упражнение ниже.
            </div>
          </div>
          <button class="full" id="addExercise">＋ Добавить упражнение</button>
        </div>
        <div class="stats">
          <div class="stat">
            <small>Упражнений</small><b id="exerciseCount">0</b>
          </div>
          <div class="stat">
            <small>Всего подходов</small><b id="setCount">0</b>
          </div>
        </div>
      </section>
      <section id="history" class="hidden">
        <h2>История</h2>
        <div class="sub">Твои сохранённые тренировки</div>
        <div id="historyList" class="card"></div>
      </section>
      <section id="progress" class="hidden">
        <h2>Прогресс</h2>
        <div class="sub">Личные показатели по сохранённым тренировкам</div>
        <div id="progressContent"></div>
      </section>
    </main>
    <nav>
      <button class="active" data-tab="workout">Тренировка</button
      ><button data-tab="history">История</button
      ><button data-tab="progress">Прогресс</button>
    </nav>
  </body>
</html>
